name: Deploy to EC2

# develop에 push되면: 이미지를 빌드해서 GHCR에 올리고, EC2에는 SSM으로 "pull + 재기동"만
# 시킨다. EC2에서 직접 빌드하지 않는다 — t4g.micro/t3.micro는 Gradle 빌드를 감당하기엔
# 너무 작아서, CPU/메모리가 바닥나 SSM 연결까지 끊기는 걸 실제로 겪었다.
on:
  push:
    branches: [develop]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # EC2가 ARM(t4g)이라 x86 러너에서 arm64 이미지를 만들려면 에뮬레이션이 필요하다
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Deploy via SSM (pull latest image + restart)
        env:
          INSTANCE_ID: ${{ secrets.SSM_INSTANCE_ID }}
        run: |
          set -e
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cd /home/ubuntu/loui-tarot-backend && git pull origin develop && docker compose -f docker-compose.prod.yml --env-file .env.prod pull && docker compose -f docker-compose.prod.yml --env-file .env.prod up -d"]' \
            --query "Command.CommandId" --output text)
          echo "SSM Command ID: $COMMAND_ID"

          # 명령이 끝날 때까지 대기 — 실패로 끝나도 wait 자체는 무시하고 아래서 상태를 직접 판단한다
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "Status" --output text)
          echo "=== stdout ==="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text
          echo "=== stderr ==="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardErrorContent" --output text

          if [ "$STATUS" != "Success" ]; then
            echo "Deploy failed with status: $STATUS"
            exit 1
          fi
